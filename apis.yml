aid: obvious-ventures
name: Obvious Ventures
description: >-
  Obvious Ventures is a San Francisco-based early-stage venture capital firm
  founded in 2014 by Ev Williams, James Joaquin, and Vishal Vasishth, investing
  in entrepreneurs building "world positive" companies that solve humanity's
  biggest problems through technology. The firm invests across three thesis
  pillars: planetary health (sustainable energy, food, mobility, climate), human
  health and longevity (healthcare, biotech, wellness), and economic health
  (fintech, the future of work, robotics, and inclusive systems). Obvious writes
  approximately 10 new checks per year, typically $5M to $12M into seed and
  Series A rounds, deliberately keeping fund sizes small enough that a single
  durable public company can return an entire fund. It closed its fifth fund at
  $360,360,360 in early 2026 and has backed 90+ companies since inception,
  including Beyond Meat, Planet, Gusto, Recursion, Devoted Health, Diamond
  Foundry, and Proterra. Obvious is a Certified B Corporation headquartered at
  190 Pacific Avenue, San Francisco, CA.
